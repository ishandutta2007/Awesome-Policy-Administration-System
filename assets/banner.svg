<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1280 400"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="cardGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1f2937" stop-opacity=".8"/><stop offset="100%" stop-color="#111827" stop-opacity=".9"/></linearGradient><linearGradient id="primaryTextGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="accentGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".4"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#374151" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes shimmerText{0%{stop-color:#60a5fa}50%{stop-color:#34d399}}.animated-bg-circle{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.flowing-path{stroke-dasharray:8 8;animation:dashFlow 4s linear infinite}.floating-card{animation:floatNode 5s ease-in-out infinite}</style></defs><rect width="1280" height="400" fill="url(#bgGradient)"/><rect width="1280" height="400" fill="url(#grid)"/><circle cx="200" cy="100" r="180" fill="#3b82f6" class="animated-bg-circle" filter="blur(60px)" opacity=".25"/><circle cx="1080" cy="300" r="200" fill="#8b5cf6" class="animated-bg-circle" filter="blur(70px)" opacity=".2"/><path fill="none" stroke="#60a5fa" stroke-opacity=